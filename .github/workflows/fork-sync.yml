name: Sync fork with upstream

# Merges jagduvi1/Cellarion's main into this fork's main. This fork DOES carry
# its own commits (the CI workflows themselves, plus this file), so `main`
# permanently diverges from upstream's linear history the moment those land --
# a strict fast-forward (the original approach here) can never succeed again
# after that point. Confirmed the hard way: the first scheduled run after
# those commits landed failed with "Not possible to fast-forward, aborting."
# A real merge handles both cases (fast-forwards when possible, merges when
# not) without ever discarding local work.
#
# If upstream and this fork's own commits ever actually conflict, the merge
# step below fails loudly and leaves `main` untouched -- resolve by hand
# (clone, `git merge upstream/main`, fix conflicts, push) rather than letting
# CI guess.
#
# A no-op run (already current) does not push, so it does not spuriously
# trigger build-harbor.yml. No workflow anywhere else in gallis-local does
# this today; it's fork-specific, not a copy of an existing pattern.
#
# The push above is authenticated with GITHUB_TOKEN, and GitHub does not let
# a GITHUB_TOKEN-authored push trigger other workflows' `on: push` (anti-
# recursion safeguard) -- so build-harbor.yml would never fire on its own
# after a sync. Explicitly dispatching it via the API sidesteps that: an
# API-triggered workflow_dispatch is exempt from the same restriction.

on:
  schedule:
    - cron: "17 13 * * 0" # weekly, Sunday, offset off the hour
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: [self-hosted, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream into main
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/jagduvi1/Cellarion.git
          git fetch upstream main
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [[ "$BEHIND" == "0" ]]; then
            echo "Already current with upstream."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Merging $BEHIND commit(s) from upstream/main."
          git merge upstream/main --no-edit
          # GITHUB_TOKEN can never hold the `workflows` permission, so GitHub
          # rejects this push whenever upstream's new commits touch
          # .github/workflows/** (runs 38143115706, 39131222623). Say so
          # instead of leaving a bare "remote rejected" to decode.
          if ! git push origin main; then
            if git diff --name-only ORIG_HEAD HEAD -- .github/workflows | grep -q .; then
              echo "::error::upstream changed .github/workflows/**, which GITHUB_TOKEN may not push. Sync by hand: clone, git merge upstream/main, push (or open a PR)."
            fi
            exit 1
          fi
          echo "synced=true" >> "$GITHUB_OUTPUT"

      # The ARC runner image has no `gh` -- run 40197289657 merged and pushed,
      # then died here with `gh: command not found` (exit 127), so the synced
      # code was never built. Pinned version + in-repo SHA-256, not a checksum
      # file fetched from the same place as the tarball.
      - name: Install GitHub CLI
        if: steps.sync.outputs.synced == 'true'
        env:
          GH_CLI_VERSION: "2.101.0"
          GH_CLI_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        run: |
          set -euo pipefail
          command -v gh >/dev/null && { gh --version; exit 0; }
          tgz="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$tgz" "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/$tgz"
          echo "${GH_CLI_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Trigger Harbor build
        if: steps.sync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-harbor.yml --repo ${{ github.repository }}
